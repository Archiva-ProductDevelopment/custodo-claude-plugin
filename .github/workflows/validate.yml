name: Validate submitted plugin

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Assemble the submission package
        run: |
          mkdir -p "$RUNNER_TEMP/custodo-plugin"
          git archive HEAD |
            tar -x -C "$RUNNER_TEMP/custodo-plugin"
      - name: Validate with Claude Code
        # v2.1.281+ recognises Anthropic's five directory listing fields.
        run: npx --yes @anthropic-ai/claude-code@2.1.325 plugin validate --strict "$RUNNER_TEMP/custodo-plugin"
      - name: Check listing links, logo and connector
        run: |
          node --input-type=module - "$RUNNER_TEMP/custodo-plugin" <<'NODE'
          import assert from "node:assert/strict";
          import { readFile, readdir, realpath } from "node:fs/promises";
          import { isAbsolute, relative, resolve } from "node:path";

          const root = await realpath(process.argv[2]);
          // Validate the entire submitted tree, including its CI declaration.
          const files = await readdir(root, { recursive: true, withFileTypes: true });
          const expectedFiles = [
            '.claude-plugin/plugin.json',
            '.github/workflows/validate.yml',
            '.gitignore',
            '.mcp.json',
            'LICENSE',
            'README.md',
            'assets/logo.png',
            'skills/custodo-workspace/SKILL.md',
          ];
          const actualFiles = [];
          for (const entry of files) {
            assert(entry.isFile() || entry.isDirectory(), 'Only regular files and directories may be submitted');
            if (entry.isFile()) actualFiles.push(relative(root, resolve(entry.parentPath, entry.name)));
          }
          assert.deepEqual(actualFiles.sort(), expectedFiles.sort(), 'Keep developer scripts outside the submitted branch');
          console.log('OK submission tree: only the eight approved plugin and declaration files');

          const manifest = JSON.parse(
            await readFile(resolve(root, ".claude-plugin/plugin.json"), "utf8"),
          );
          for (const field of ['hooks', 'commands', 'agents', 'lspServers', 'monitors', 'workflows', 'mcpServers', 'userConfig']) {
            assert.equal(manifest[field], undefined, `This OAuth-only plugin does not declare ${field}`);
          }
          const workflow = await readFile(resolve(root, '.github/workflows/validate.yml'), 'utf8');
          assert.doesNotMatch(workflow, /(?:^|\n)\s*(?:run|steps|secrets|env)\s*:/, 'The submitted CI file must only call the external validator');
          assert.match(workflow, /uses: Archiva-ProductDevelopment\/custodo-claude-plugin\/\.github\/workflows\/validate\.yml@[0-9a-f]{40}(?:\s|$)/, 'Pin the external validator to a complete commit SHA');
          console.log('OK runtime: OAuth-only connector and no submitted validation scripts');

          const mcp = JSON.parse(await readFile(resolve(root, ".mcp.json"), "utf8"));

          // These are directory listing fields, even though older scanners warn about them.
          // https://code.claude.com/docs/en/plugins/manifest-reference#directory-listing-fields
          for (const key of [
            "documentationUrl",
            "supportUrl",
            "privacyPolicyUrl",
            "termsOfServiceUrl",
          ]) {
            assert.equal(
              typeof manifest[key],
              "string",
              `${key} is required for the listing`,
            );
            const url = new URL(manifest[key]);
            assert.equal(url.protocol, "https:", `${key} must use HTTPS`);
            assert.equal(url.origin, "https://custodo.ai", `${key} must link to Custodo`);
            assert.equal(
              url.username + url.password,
              "",
              `${key} must not contain credentials`,
            );

            const response = await fetch(url, { signal: AbortSignal.timeout(20_000) });
            assert.equal(response.status, 200, `${key}: HTTP ${response.status}`);
            assert.equal(
              new URL(response.url).origin,
              url.origin,
              `${key} redirects outside Custodo`,
            );
            assert.match(
              response.headers.get("content-type") ?? "",
              /text\/html/i,
              `${key}: expected HTML`,
            );
            const html = await response.text();
            assert.doesNotMatch(
              html,
              /\{\{DA_COMPILARE/i,
              `${key} contains an unfinished legal field`,
            );
            if (url.hash) {
              const anchor = decodeURIComponent(url.hash.slice(1));
              assert(
                html.includes(`id="${anchor}"`) || html.includes(`id='${anchor}'`),
                `${key}: missing anchor ${url.hash}`,
              );
            }
            console.log(`OK ${key}: ${url.href}`);
          }

          assert.equal(
            typeof manifest.icon,
            "string",
            "The directory listing needs an icon",
          );
          assert(
            manifest.icon.startsWith("./"),
            "The icon must be relative to the plugin root",
          );
          const iconPath = await realpath(resolve(root, manifest.icon));
          const iconRelative = relative(root, iconPath);
          assert(
            iconRelative !== ".." &&
              !iconRelative.startsWith("../") &&
              !isAbsolute(iconRelative),
            "The icon must stay inside the plugin package",
          );
          const icon = await readFile(iconPath);
          assert(icon.length >= 24, "The logo is missing its PNG header");
          assert(
            icon.subarray(0, 8).equals(Buffer.from([137, 80, 78, 71, 13, 10, 26, 10])),
            "The logo must be PNG",
          );
          assert.equal(
            icon.toString("ascii", 12, 16),
            "IHDR",
            "The PNG needs an IHDR chunk",
          );
          assert.equal(icon.readUInt32BE(16), 512, "The logo must be 512 pixels wide");
          assert.equal(icon.readUInt32BE(20), 512, "The logo must be 512 pixels high");
          assert(icon.length <= 1024 * 1024, "The logo must be at most 1 MiB");
          console.log("OK icon: packaged 512×512 PNG");

          assert.deepEqual(
            mcp,
            {
              mcpServers: {
                custodo: { type: "http", url: "https://api.custodo.ai/mcp" },
              },
            },
            "Keep the full, remote Custodo connector without embedded credentials or local commands",
          );
          console.log("OK MCP: full remote Custodo catalogue");
          NODE
      - name: Archive the validated plugin
        shell: bash
        run: |
          version="$(node -p "require(process.env.RUNNER_TEMP + '/custodo-plugin/.claude-plugin/plugin.json').version")"
          archive="custodo-claude-plugin-${version}.zip"
          cd "$RUNNER_TEMP/custodo-plugin"
          zip -qrX "$RUNNER_TEMP/$archive" .claude-plugin .mcp.json assets skills README.md LICENSE
          cd "$RUNNER_TEMP"
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-plugin
          path: |
            ${{ runner.temp }}/custodo-claude-plugin-*.zip
            ${{ runner.temp }}/custodo-claude-plugin-*.zip.sha256
          if-no-files-found: error
